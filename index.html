<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070f" />
    <title>NEON SURVIVOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="hud">
      <div class="hud-l">
        <div class="hud-row">
          <span class="lbl">TIME</span><span class="val" id="hTime">0:00</span>
        </div>
        <div class="hud-row">
          <span class="lbl">LVL</span><span class="val" id="hLvl">1</span>
        </div>
      </div>
      <div class="hud-r">
        <div class="hud-row">
          <span class="lbl">KILLS</span><span class="val" id="hKills">0</span>
        </div>
        <div class="hud-row">
          <span class="lbl">BEST</span><span class="val" id="hBest">0:00</span>
        </div>
      </div>
    </div>
    <div class="hp-wrap"><div class="hp-fill" id="hpFill"></div></div>
    <div class="xp-wrap"><div class="xp-fill" id="xpFill"></div></div>
    <div class="combo" id="combo">x1</div>
    <div class="wave-toast" id="wave"></div>
    <div class="flash" id="flash"></div>
    <div class="lvl-flash" id="lvlFlash"></div>

    <button class="btn-ctrl btn-pause" id="btnPause" aria-label="Pause">
      ||
    </button>
    <button class="btn-ctrl btn-mute" id="btnMute" aria-label="Mute">♪</button>

    <div class="menu" id="mStart">
      <h1>NEON<br /><span class="ac">SURVIVOR</span></h1>
      <p>
        Sống sót giữa làn sóng quái neon vô tận. Di chuyển bằng
        <span class="k">WASD</span> hoặc <span class="k">kéo màn hình</span>. Tự
        động bắn quái gần nhất. Nhặt gem xanh để lên cấp và chọn buff.
      </p>
      <button class="btn" id="btnStart">▶ Bắt đầu</button>
      <div class="hs" id="hsStart"></div>
      <div class="hint">P = PAUSE · M = MUTE · F = FULLSCREEN</div>
    </div>

    <div class="menu hidden" id="mPause">
      <h1>PAUSED</h1>
      <button class="btn" id="btnResume">▶ Tiếp tục</button>
      <button class="btn danger" id="btnQuit">⏹ Bỏ ván</button>
    </div>

    <div class="menu hidden" id="mLevel">
      <h2>LEVEL UP</h2>
      <p>Chọn 1 buff để tiếp tục</p>
      <div class="ups" id="upCards"></div>
    </div>

    <div class="menu hidden" id="mOver">
      <h2>YOU DIED</h2>
      <div class="stats" id="finalStats"></div>
      <div class="hs" id="hsOver"></div>
      <button class="btn" id="btnRetry">↻ Chơi lại</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
